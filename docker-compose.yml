services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: placement
      POSTGRES_USER: placement
      POSTGRES_PASSWORD: placement
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U placement"]
      interval: 5s
      retries: 10
  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://placement:placement@db:5432/placement
      DJANGO_SECURE_SSL_REDIRECT: "0"
    ports: ["8000:8000"]
    volumes: [media:/data/media]
    depends_on:
      db: {condition: service_healthy}
volumes:
  pgdata:
  media:
