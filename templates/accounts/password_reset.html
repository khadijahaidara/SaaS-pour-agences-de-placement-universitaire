{% extends "base.html" %}{% block title %}Mot de passe oublié{% endblock %}
{% block content %}
<div class="auth-box card"><h1>Mot de passe oublié</h1>
<p class="muted">Saisissez votre courriel : vous recevrez un lien pour choisir un nouveau mot de passe.</p>
<form method="post">{% csrf_token %}{% include "includes/form.html" %}<button class="btn block" type="submit">Envoyer le lien</button></form>
<p class="small"><a href="{% url 'accounts:login' %}">Retour à la connexion</a></p></div>
{% endblock %}
